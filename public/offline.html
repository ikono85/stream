<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#04070F" />
    <title>Hors connexion — Lucarne</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #04070f; color: #eef1f7; font-family: system-ui, sans-serif; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      .mark { font-size: 3rem; color: #f0a63c; }
      h1 { font-size: 1.8rem; } p { color: #a6b1c7; line-height: 1.65; }
      button { margin-top: 1rem; padding: .9rem 1.5rem; border: 0; border-radius: 2rem; background: #f0a63c; color: #04070f; font: inherit; font-weight: 650; cursor: pointer; }
      button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">◉</div>
      <h1>La connexion fait une pause</h1>
      <p>Lucarne a besoin d’Internet pour afficher le catalogue, lire vos vidéos et écouter la radio. Retrouvez votre connexion, puis réessayez.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
